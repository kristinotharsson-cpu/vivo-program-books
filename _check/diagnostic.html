<!doctype html>
<html>
<head>
<title>Vivo Diagnostic</title>
<meta charset="utf-8" />
<style>
  body { font-family: system-ui, sans-serif; background: #fff; color: #000; padding: 24px; max-width: 720px; margin: 0 auto; }
  h1 { color: #BD2691; }
  pre { background: #f4f4f4; padding: 12px; border-radius: 6px; overflow: auto; font-size: 12px; }
  .ok { color: green; font-weight: bold; }
  .fail { color: red; font-weight: bold; }
  .row { padding: 8px 0; border-bottom: 1px solid #eee; }
  button { background: #BD2691; color: #fff; border: 0; padding: 10px 16px; font-weight: 700; cursor: pointer; border-radius: 4px; margin-right: 8px; }
</style>
</head>
<body>
<h1>Vivo Diagnostic</h1>
<p>If you can see this page, basic HTML rendering works.</p>
<div id="results"></div>
<h3>Repair</h3>
<p>Most "all pages blank" issues are caused by stale browser cache or a corrupted localStorage entry from an earlier schema. Click these to fix:</p>
<button onclick="localStorage.clear(); document.getElementById('cleared').textContent = 'localStorage cleared. Now hard-reload (Cmd+Shift+R or Ctrl+Shift+R) and revisit your program book.';">Clear localStorage</button>
<div id="cleared" style="margin-top:12px; color: green; font-weight: 600;"></div>

<script>
const results = document.getElementById('results');
const checks = [];

function row(label, ok, detail) {
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = '<span class="' + (ok ? 'ok' : 'fail') + '">' + (ok ? '✓' : '✗') + '</span> ' + label + (detail ? ' <small style="opacity:0.6">' + detail + '</small>' : '');
  results.appendChild(div);
}

row('HTML + CSS + inline JS works', true);

// localStorage probe
try {
  const keys = Object.keys(localStorage).filter(k => k.startsWith('vivo'));
  row('localStorage', true, 'vivo keys: ' + (keys.length ? keys.join(', ') : 'none'));
  if (keys.length) {
    keys.forEach(k => {
      try {
        const v = localStorage.getItem(k);
        const len = v ? v.length : 0;
        row('  → ' + k, true, len + ' chars');
      } catch (e) {
        row('  → ' + k, false, e.message);
      }
    });
  }
} catch (e) {
  row('localStorage', false, e.message);
}

// Try loading React from CDN (matches Program Book versions)
const r = document.createElement('script');
r.src = 'https://unpkg.com/react@18.3.1/umd/react.development.js';
r.crossOrigin = 'anonymous';
r.integrity = 'sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L';
r.onload = () => row('React CDN loaded', true, 'React ' + (window.React && window.React.version));
r.onerror = (e) => row('React CDN', false, 'failed to load — network or CDN blocked');
document.head.appendChild(r);

// Try fetching key project files
async function probe(path) {
  try {
    const res = await fetch(path);
    row('Fetch ' + path, res.ok, 'HTTP ' + res.status);
  } catch (e) {
    row('Fetch ' + path, false, e.message);
  }
}
probe('vivo.css');
probe('app.css');
probe('data.js');
probe('app.jsx');
</script>
</body>
</html>
