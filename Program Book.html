<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5" />
  <meta name="theme-color" content="#FFFBEB" />
  <title>From Afar — Víkingur Ólafsson · Vivo Performing Arts</title>

  <link rel="stylesheet" href="vivo.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="vivo-section.css" />

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#FFFBEB"/>
      <rect x="40" y="40" width="120" height="120" fill="#BD2691"/>
      <text x="100" y="118" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#FFFBEB" text-anchor="middle" letter-spacing="-1">VIVO</text>
    </svg>
  </template>
</head>
<body>
  <noscript>This program book requires JavaScript.</noscript>
  <div id="app"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Sample content (used when ?show is not specified) -->
  <script src="data.js"></script>
  <script src="storage.js"></script>

  <!-- Per-show loader: if ?show=<slug>, fetch shows/<slug>.json and replace PROGRAM_DATA before app boots. -->
  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var slug = params.get('show');
    // Also accept a path like /<slug>/ (so CloudFront URL rewrites can drop the param)
    if (!slug) {
      var m = location.pathname.match(/\/([a-z0-9][a-z0-9-]+)\/?$/);
      if (m && m[1] !== 'index' && !m[1].endsWith('.html')) slug = m[1];
    }
    if (!slug) return; // use bundled sample
    // Namespace localStorage per show so 80 shows don't share state
    window.__VIVO_STORAGE_KEY = 'vivo-pb-data:' + slug;
    // Block React boot until JSON is ready
    window.__PROGRAM_BOOT_DEFERRED = true;
    // Prefer the saved program record (Netlify Blobs when deployed, localStorage here);
    // fall back to the repo shell JSON.
    var recP = window.VivoStore ? window.VivoStore.getProgram(slug).catch(function(){ return null; }) : Promise.resolve(null);
    Promise.all([
      recP,
      fetch('shows/' + slug + '.json').then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); }),
      fetch('shows/_vivo-shared.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ])
      .then(function (results) {
        var rec = results[0];
        var data = (rec && rec.data && rec.data.sections) ? rec.data : results[1];
        var shell = results[1];
        var shared = results[2];
        // Venue is canonical scheduling data — always take it from the shell JSON so venue
        // changes propagate even to already-saved (cached) program records.
        try {
          if (rec && shell && shell.cover) {
            data.cover = Object.assign({}, data.cover, { venue: shell.cover.venue });
            var shInfo = (shell.sections || []).filter(function (s) { return s.kind === 'info'; })[0];
            var dInfo = (data.sections || []).filter(function (s) { return s.kind === 'info'; })[0];
            if (shInfo && dInfo) {
              var shV = (shInfo.sections || []).filter(function (x) { return /^venue$/i.test((x.h || '').trim()); })[0];
              var dV = (dInfo.sections || []).filter(function (x) { return /^venue$/i.test((x.h || '').trim()); })[0];
              if (shV && dV) dV.body = shV.body;
            }
          }
        } catch (e) {}
        // Resolve supporters for THIS program's date: an edit stamped on an earlier- or
        // same-dated program applies here; edits from later programs do not.
        try {
          if (shared && window.VivoStore && window.VivoStore.resolveVersion) {
            var dnum = window.VivoStore.parseDate(data.cover && data.cover.date);
            if (shared.supporters) shared = Object.assign({}, shared, { supporters: window.VivoStore.resolveVersion("supporters", shared.supporters, dnum) });
            var sb = { staff: shared.staff, boards: shared.boards };
            var rsb = window.VivoStore.resolveVersion("staffBoard", sb, dnum);
            if (rsb) shared = Object.assign({}, shared, { staff: rsb.staff, boards: rsb.boards });
          }
        } catch (e) {}
        if (shared) window.VIVO_SHARED = shared;
        window.PROGRAM_DATA = data;
        document.title = data.cover.title + ' — Vivo Performing Arts';
        window.__PROGRAM_BOOT_DEFERRED = false;
        if (window.__bootProgramApp) window.__bootProgramApp();
      })
      .catch(function (e) {
        document.getElementById('app').innerHTML =
          '<div style="font-family:Inter,sans-serif;max-width:520px;margin:80px auto;padding:32px;text-align:center;">' +
          '<h1 style="font-size:24px;margin:0 0 12px;">Show not found</h1>' +
          '<p style="color:#666;margin:0 0 24px;">No program for "<code>' + slug + '</code>".</p>' +
          '<a href="index.html" style="color:#BD2691;font-weight:600;">← Back to all programs</a>' +
          '</div>';
      });
  })();
  </script>

  <!-- App scripts (order matters) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="import-overlay.jsx"></script>
  <script type="text/babel" src="songtexts.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
