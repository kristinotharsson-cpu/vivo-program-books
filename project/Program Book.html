<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5" />
  <meta name="theme-color" content="#FFFBEB" />
  <title>From Afar — Víkingur Ólafsson · Vivo Performing Arts</title>

  <link rel="stylesheet" href="vivo.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="vivo-section.css" />

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#FFFBEB"/>
      <rect x="40" y="40" width="120" height="120" fill="#BD2691"/>
      <text x="100" y="118" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#FFFBEB" text-anchor="middle" letter-spacing="-1">VIVO</text>
    </svg>
  </template>
</head>
<body>
  <noscript>This program book requires JavaScript.</noscript>
  <div id="app"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Sample content (used when ?show is not specified) -->
  <script src="data.js"></script>

  <!-- Per-show loader: if ?show=<slug>, fetch shows/<slug>.json and replace PROGRAM_DATA before app boots. -->
  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var slug = params.get('show');
    // Also accept a path like /<slug>/ (so CloudFront URL rewrites can drop the param)
    if (!slug) {
      var m = location.pathname.match(/\/([a-z0-9][a-z0-9-]+)\/?$/);
      if (m && m[1] !== 'index' && !m[1].endsWith('.html')) slug = m[1];
    }
    if (!slug) return; // use bundled sample
    // Namespace localStorage per show so 80 shows don't share state
    window.__VIVO_STORAGE_KEY = 'vivo-pb-data:' + slug;
    // Block React boot until JSON is ready
    window.__PROGRAM_BOOT_DEFERRED = true;

    function bootWithData(data, shared) {
      if (shared) window.VIVO_SHARED = shared;
      window.PROGRAM_DATA = data;
      document.title = (data.cover && data.cover.title ? data.cover.title : slug) + ' — Vivo Performing Arts';
      window.__PROGRAM_BOOT_DEFERRED = false;
      if (window.__bootProgramApp) window.__bootProgramApp();
    }

    // Check if this is a locally-created program (created via New Program wizard)
    try {
      var newSlugs = JSON.parse(localStorage.getItem('vivo-new-shows') || '[]');
      if (newSlugs.indexOf(slug) !== -1) {
        var localData = JSON.parse(localStorage.getItem('vivo-pb-data:' + slug) || 'null');
        if (localData) {
          bootWithData(localData, null);
          return;
        }
      }
    } catch (e) {}

    Promise.all([
      fetch('shows/' + slug + '.json').then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); }),
      fetch('shows/_vivo-shared.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ])
      .then(function (results) {
        bootWithData(results[0], results[1]);
      })
      .catch(function (e) {
        // Last resort: if we have local edits for this slug (e.g. offline, or fetch failed), use them
        try {
          var localData = JSON.parse(localStorage.getItem('vivo-pb-data:' + slug) || 'null');
          if (localData) { bootWithData(localData, null); return; }
        } catch (_) {}
        document.getElementById('app').innerHTML =
          '<div style="font-family:Inter,sans-serif;max-width:520px;margin:80px auto;padding:32px;text-align:center;">' +
          '<h1 style="font-size:24px;margin:0 0 12px;">Show not found</h1>' +
          '<p style="color:#666;margin:0 0 24px;">No program for "<code>' + slug + '</code>".</p>' +
          '<a href="index.html" style="color:#BD2691;font-weight:600;">← Back to all programs</a>' +
          '</div>';
      });
  })();
  </script>

  <!-- App scripts (order matters) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
