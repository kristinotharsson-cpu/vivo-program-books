<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5" />
  <meta name="theme-color" content="#000000" />
  <title>Import from PDF — Vivo Program Books</title>

  <link rel="stylesheet" href="vivo.css" />
  <link rel="stylesheet" href="import.css" />

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#000"/>
      <rect x="40" y="40" width="120" height="120" fill="#BD2691"/>
      <text x="100" y="118" font-family="Arial Black, sans-serif" font-size="40" font-weight="900" fill="#FFFBEB" text-anchor="middle" letter-spacing="-1">PDF</text>
    </svg>
  </template>
</head>
<body data-theme="dark" style="background:#000;min-height:100vh">
  <noscript>This page requires JavaScript.</noscript>
  <div id="import-root"></div>

  <!-- PDF.js (UMD build exposes window.pdfjsLib) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>

  <!-- Stage 1 extractor (plain script, defines window.extractPdfText) -->
  <script src="parser/extract-text.jsx"></script>

  <script type="module" src="./import-app.jsx"></script>
</body>
</html>
